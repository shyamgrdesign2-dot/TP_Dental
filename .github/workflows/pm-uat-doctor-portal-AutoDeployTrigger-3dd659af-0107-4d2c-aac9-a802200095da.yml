name: Trigger auto deployment for pm-uat-doctor-portal

on:
  push:
    branches:
      - uat
    paths:
      - '**'
      - '.github/workflows/pm-uat-doctor-portal-AutoDeployTrigger-3dd659af-0107-4d2c-aac9-a802200095da.yml'

  workflow_dispatch:

concurrency:
  group: pm-uat-doctor-portal
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      REACT_APP_ENV: uat
      # Upload → blob container react-static-uat/cdn/... Front Door exposes that as /cdn/... (not /react-static-uat/cdn/).
      PUBLIC_URL_UAT_CDN: https://pm-doctor-portal-qa-ceg2g0auf6gmgpam.a02.azurefd.net/cdn/
      IMAGE_NAME: acinacr.azurecr.io/pm-uat-doctor-portal:${{ github.sha }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      # ---- 1. Build image and push to ACR (no Container App update yet) ----
      # Generate version.json here in CI where git is guaranteed to be available.
      # Do NOT rely on generate-version.js running inside the Docker build —
      # .dockerignore typically excludes .git so git rev-parse would silently fail there.
      # This file is baked into the image but intentionally excluded from blob upload below.
      - name: Generate version.json
        run: |
          set -euo pipefail
          SHA=$(git rev-parse --short HEAD)
          API_VERSION=$(node -e "console.log(require('./package.json').apiCompatibilityVersion ?? 1)")
          echo "{\"version\":\"$SHA\",\"apiVersion\":$API_VERSION}" > public/version.json

      - name: Docker login to ACR
        env:
          REGISTRY_USER: ${{ secrets.PMUATDOCTORPORTAL_REGISTRY_USERNAME }}
          REGISTRY_PASS: ${{ secrets.PMUATDOCTORPORTAL_REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$REGISTRY_PASS" | docker login acinacr.azurecr.io -u "$REGISTRY_USER" --password-stdin

      - name: Build image and push to ACR
        run: |
          set -euo pipefail
          docker build \
            --build-arg REACT_APP_ENV=uat \
            --build-arg REACT_APP_CLARITY_ID_UAT=n93vwh8yqg \
            --build-arg REACT_APP_MOENGAGE_LOGS_UAT=1 \
            --build-arg GENERATE_SOURCEMAP=true \
            --build-arg SENTRY_AUTH_TOKEN="${{ secrets.SENTRY_AUTH_TOKEN }}" \
            --build-arg PUBLIC_URL="${{ env.PUBLIC_URL_UAT_CDN }}" \
            -t "${{ env.IMAGE_NAME }}" .
          docker push "${{ env.IMAGE_NAME }}"

      # ---- 2. Extract built assets from the same image we just pushed ----
      - name: Extract built assets (html minus index.html and version.json)
        run: |
          set -euo pipefail
          CID=$(docker create "${{ env.IMAGE_NAME }}")
          mkdir -p _blob_html
          docker cp "$CID:/usr/share/nginx/html/." _blob_html/
          docker rm -v "$CID"
          # index.html and version.json must only be served from the container (nginx),
          # never from blob/CDN — both need no-cache guarantees that blob cannot provide.
          rm -f _blob_html/index.html
          rm -f _blob_html/version.json

      # ---- 3. Upload to blob BEFORE the Container App revision switch ----
      # PMUATDOCTORPORTAL_BLOB_UPLOAD_CREDENTIALS — JSON for azure/login `creds` (clientId, clientSecret,
      # subscriptionId, tenantId). subscriptionId must contain pmdoctorportal storage account.
      # RBAC: Storage Blob Data Contributor on pmdoctorportal (or scoped to react-static-uat).
      - name: Azure Login (blob upload identity)
        uses: azure/login@v1
        with:
          creds: ${{ secrets.PMUATDOCTORPORTAL_BLOB_UPLOAD_CREDENTIALS }}

      # upload-batch never deletes blobs missing from --source, so previously uploaded
      # hashed chunks survive. --overwrite only affects identical paths (e.g. manifest.json,
      # favicon.ico) which we WANT current.
      - name: Publish build assets to Azure Blob (react-static-uat/cdn)
        run: |
          set -euo pipefail
          az storage blob upload-batch \
            --account-name pmdoctorportal \
            --auth-mode login \
            --destination react-static-uat \
            --source _blob_html \
            --destination-path cdn \
            --overwrite

      # ---- 4. Now switch the Container App to the new image (assets already in place) ----
      - name: Azure Login (deploy identity)
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.PMUATDOCTORPORTAL_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.PMUATDOCTORPORTAL_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.PMUATDOCTORPORTAL_AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Container App revision
        run: |
          set -euo pipefail
          az containerapp update \
            --name pm-uat-doctor-portal \
            --resource-group tatva-uat \
            --image "${{ env.IMAGE_NAME }}"