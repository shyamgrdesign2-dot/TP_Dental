name: Trigger auto deployment for zy-prod-doctor-portal

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ prod ]
    paths:
    - '**'
    - '.github/workflows/zy-prod-doctor-portal-AutoDeployTrigger-be1b6188-dc72-4883-ac40-faeb7ad49060.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ZYPRODDOCTORPORTAL_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.ZYPRODDOCTORPORTAL_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.ZYPRODDOCTORPORTAL_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: zypractice05.azurecr.io
          registryUsername: ${{ secrets.ZYPRODDOCTORPORTAL_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.ZYPRODDOCTORPORTAL_REGISTRY_PASSWORD }}
          containerAppName: zy-prod-doctor-portal
          resourceGroup: practice-prod
          imageToBuild: zypractice05.azurecr.io/zy-prod-doctor-portal:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


