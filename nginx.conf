load_module /usr/lib/nginx/modules/ngx_http_brotli_filter_module.so;
load_module /usr/lib/nginx/modules/ngx_http_brotli_static_module.so;

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
  access_log /var/log/nginx/access.log main;

  sendfile on;
  keepalive_timeout 65;

  # Compress static assets to avoid Sentry "Uncompressed Asset" issues
  brotli on;
  brotli_comp_level 5;
  brotli_min_length 256;
  brotli_static on;
  brotli_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/xml+rss
    image/svg+xml
    font/ttf
    font/otf
    application/font-woff
    application/font-woff2;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_vary on;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/xml+rss
    image/svg+xml
    font/ttf
    font/otf
    application/font-woff
    application/font-woff2;
  
  server {
    listen 80;
    root /usr/share/nginx/html;

    add_header Content-Security-Policy "frame-ancestors 'self' https://tatvapractice.getvisitapp.net https://tatvapractice.getvisitapp.com https://kea.getvisitapp.com https://hospital-dashboard.getvisitapp.net" always;

    location /case_manager/pdf_casemanager_send.php {
      add_header 'Access-Control-Allow-Origin' '*';
      add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
      add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With';
      add_header 'Access-Control-Allow-Credentials' 'true';
      proxy_pass https://pm-uat-dhspl-2.tatvacare.in;
    }

    # 1) NEVER cache HTML (app shell)
    location = /index.html {
      add_header Cache-Control "no-store, must-revalidate" always;
      try_files $uri =404;
    }

    # 2) CRA: everything under /static is fingerprinted => cache forever
    location ^~ /static/ {
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    # 3) Short cache for non-hashed root assets
    location ~* ^/(manifest\.json|asset-manifest\.json|favicon\.ico|robots\.txt|logo192\.png|logo512\.png)$ {
      expires 1h;
      add_header Cache-Control "public, max-age=3600" always;
      try_files $uri =404;
    }

    # 4) SPA routing
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
