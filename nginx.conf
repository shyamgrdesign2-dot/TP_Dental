user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
  access_log /var/log/nginx/access.log main;

  sendfile on;
  keepalive_timeout 65;

  # Map for CSP
  map $request_uri $frame_policy {
    default "frame-ancestors 'none'";  # Block by default
    
    # Exact match for root path only
    "~^/$" "frame-ancestors 'self' https://tatvapractice.getvisitapp.net https://tatvapractice.getvisitapp.com";
    
    # Specific routes
    ~^/abha-standalone "frame-ancestors 'self' https://tatvapractice.getvisitapp.net https://tatvapractice.getvisitapp.com";
    ~^/billing-dashboard "frame-ancestors 'self' https://tatvapractice.getvisitapp.net https://tatvapractice.getvisitapp.com";
  }

  # Map for X-Frame-Options (for older browser compatibility)
  map $request_uri $x_frame_options {
    default "DENY";
    "~^/$" "SAMEORIGIN";
    ~^/abha-standalone "SAMEORIGIN";
    ~^/billing-dashboard "SAMEORIGIN";
  }

  
  server {
    listen 80;

    location /case_manager/pdf_casemanager_send.php {
      add_header 'Access-Control-Allow-Origin' '*';
      add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
      add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With';
      add_header 'Access-Control-Allow-Credentials' 'true';
      proxy_pass https://pm-uat-dhspl-2.tatvacare.in;
    }

    location / {
      root /usr/share/nginx/html;
      index index.html index.htm;
      try_files $uri $uri/ /index.html =404;

      # Use the dynamic CSP from map
      add_header Content-Security-Policy "$frame_policy" always;
      
      # Keep X-Frame-Options for older browsers
      add_header X-Frame-Options "$x_frame_options" always;
      
      # Prevent MIME type sniffing
      add_header X-Content-Type-Options "nosniff" always;
      
      # Control referrer information
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      
    }
  }
}