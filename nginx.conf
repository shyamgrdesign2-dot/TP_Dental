user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
  access_log /var/log/nginx/access.log main;

  sendfile on;
  keepalive_timeout 65;
  
  server {
    listen 80;

    # Clickjacking protection: allow framing only from same origin and Visit Health domains
    add_header Content-Security-Policy "frame-ancestors 'self' https://tatvapractice.getvisitapp.net https://tatvapractice.getvisitapp.com https://kea.getvisitapp.com https://hospital-dashboard.getvisitapp.net" always;

    location /case_manager/pdf_casemanager_send.php {
      add_header 'Access-Control-Allow-Origin' '*';
      add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
      add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With';
      add_header 'Access-Control-Allow-Credentials' 'true';
      proxy_pass https://pm-uat-dhspl-2.tatvacare.in;
    }

    # Static assets
    location ^~ /static/ {
      root /usr/share/nginx/html;
      add_header Content-Security-Policy "frame-ancestors 'self' https://tatvapractice.getvisitapp.net https://tatvapractice.getvisitapp.com https://kea.getvisitapp.com https://hospital-dashboard.getvisitapp.net" always;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    # Service worker
    location = /serviceworker.js {
      root /usr/share/nginx/html;
      add_header Content-Security-Policy "frame-ancestors 'self' https://tatvapractice.getvisitapp.net https://tatvapractice.getvisitapp.com https://kea.getvisitapp.com https://hospital-dashboard.getvisitapp.net" always;
      add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;
      try_files $uri =404;
    }

    # version.json — must ALWAYS be served fresh from the container.
    # Never cache this via CDN or proxy; stale responses break update detection.
    location = /version.json {
      root /usr/share/nginx/html;
      add_header Content-Security-Policy "frame-ancestors 'self' https://tatvapractice.getvisitapp.net https://tatvapractice.getvisitapp.com https://kea.getvisitapp.com https://hospital-dashboard.getvisitapp.net" always;
      add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;
      try_files $uri =404;
    }

    # SPA — index.html must never be cached so browsers always fetch the latest entry point
    location / {
      root /usr/share/nginx/html;
      index index.html;
      add_header Content-Security-Policy "frame-ancestors 'self' https://tatvapractice.getvisitapp.net https://tatvapractice.getvisitapp.com https://kea.getvisitapp.com https://hospital-dashboard.getvisitapp.net" always;
      add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;
      try_files $uri $uri/ /index.html;
    }
  }
}