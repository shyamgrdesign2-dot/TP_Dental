user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
  access_log /var/log/nginx/access.log main;

  sendfile on;
  keepalive_timeout 65;
  etag on;
  
  server {
    listen 80;

    # Clickjacking protection: allow framing only from same origin and Visit Health domains
    add_header Content-Security-Policy "frame-ancestors 'self' https://tatvapractice.getvisitapp.net https://tatvapractice.getvisitapp.com https://kea.getvisitapp.com https://hospital-dashboard.getvisitapp.net" always;

    location /case_manager/pdf_casemanager_send.php {
      add_header 'Access-Control-Allow-Origin' '*';
      add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
      add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With';
      add_header 'Access-Control-Allow-Credentials' 'true';
      proxy_pass https://pm-uat-dhspl-2.tatvacare.in;
    }

    location / {
      root /usr/share/nginx/html;
      index index.html index.htm;
      try_files $uri $uri/ /index.html =404;
    }

    # Long-term caching for hashed static assets
    # Matches filenames like main.8f3a1b2c.js, styles.1234abcd.css, etc.
    location ~* \.[0-9a-f]{8,}\.(?:js|css|mjs|json|map|png|jpe?g|gif|webp|svg|ico|woff2?|ttf|eot)$ {
      root /usr/share/nginx/html;
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    # Short cache for non-hashed assets (safety net)
    location ~* \.(?:js|css|mjs|json|map|png|jpe?g|gif|webp|svg|ico|woff2?|ttf|eot)$ {
      root /usr/share/nginx/html;
      expires 1h;
      add_header Cache-Control "public, max-age=3600" always;
      try_files $uri =404;
    }

    # Never cache HTML to ensure fresh app shell
    location ~* \.html$ {
      root /usr/share/nginx/html;
      add_header Cache-Control "no-store, must-revalidate" always;
      try_files $uri =404;
    }
  }
}
